---
- name: Créer le volume Jenkins
  community.docker.docker_volume:
    name: jenkins_home
    state: present

- name: Lancer Jenkins
  community.docker.docker_container:
    name: jenkins
    image: jenkins/jenkins:lts
    state: started
    restart_policy: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - "jenkins_home:/var/jenkins_home"
